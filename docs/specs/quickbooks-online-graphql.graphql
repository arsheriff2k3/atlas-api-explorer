# STATUS: reconstructed, UNOFFICIAL, PARTIAL.
# - Intuit does not publish this schema as SDL. Nothing here was introspected.
# - Derived on 2026-11-18 only from Intuit's own published code and docs:
#     * intuit/intuit-cli-for-quickbooks (src/commands/custom-fields.*, dimensions.*, projects.*)
#     * IntuitDeveloper sample apps: SampleApp-CustomFields-{Java,Python,DotNet},
#       Sampleapp-Customfields-Nodejs, SampleApp-Project-NodeJS, SampleApp-SalesTax-{Java,DotNet,NodeJS},
#       SampleApp-EmployeeCompensation-DotNet, Prompt-Library (discover/prompt-config.json and generated prompts)
# - Every field, argument, input type and enum value is backed by a source file; where a name, type,
#   nullability or cardinality was not published it is marked in the description ("inferred" / "not published").
# - Payroll endpoint note: the PayrollSamples repo uses https://v4thirdparty.api.intuit.com/graphql, not this host.
#   Only the payroll root fields that the EmployeeCompensation sample sends to qb.api.intuit.com are included here.
# - Regenerate this file via introspection once an OAuth token is available (not done here).
#
# Scalars Date, DateTime, Decimal and PositiveInt are named in Intuit's code/docs.
# Money is named "(Money)" in Prompt-Library; its object/input shape comes from the sample apps.

scalar Date
scalar DateTime
scalar Decimal
scalar PositiveInt

